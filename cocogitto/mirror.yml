# ⚠ `extends:` is a SHALLOW merge of TOP-LEVEL KEYS. Setting a key here
# REPLACES the base's block outright — there is no per-key merge. `platforms:`
# is deliberately NOT restated below: it carries the container legs that make
# this spec's asymmetric libc claims honest, and restating it to tweak one
# runner would drop them all without reddening anything. This repo is
# single-package, so the measured matrix lives in the base and nothing here
# touches it.
extends: ../mirror-base.yml

name: cocogitto

# Logical index package `cocogitto/cocogitto` at the physical path
# `ghcr.io/ocx-contrib/cocogitto/cocogitto` — slash segments, never
# hyphen-flattened. Two segments always. `cocogitto` is the project's own org
# and its own brand, so the org names the namespace; the package segment is
# the name the project PUBLISHES under (`cocogitto`), not the binary you type
# (`cog`) — same relationship as `github/cli` shipping `gh`. The first segment
# must be this repo's own GitHub owner: GITHUB_TOKEN only authorises packages
# owned by the repo the workflow runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/cocogitto/cocogitto

source:
  type: github_release
  owner: cocogitto
  repo: cocogitto
  # ⚠ TWO TAG SCHEMES SHARE THIS REPOSITORY, and only one of them carries
  # release objects. `gh api repos/cocogitto/cocogitto/tags` lists:
  #
  #   7.0.0, 6.5.0, 6.4.0, …            ← bare semver; THESE carry the releases
  #   cocogitto-7.0.0, cocogitto-6.5.0  ← a dead twin scheme for the SAME
  #                                       versions, zero release objects
  #   cocogitto-dependency-resolver-0.1.0 ← an unrelated internal crate
  #
  # A loose pattern that also admitted the `cocogitto-` prefix would resolve
  # tags with no assets behind them; anchoring on the bare form is what keeps
  # this mirror pointed at the releases. Verified against
  # `gh api repos/cocogitto/cocogitto/releases` — every release's tag_name is
  # bare, none is a prerelease.
  tag_pattern: "^(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# Upstream's Linux coverage is ASYMMETRIC — x86_64 ships musl ONLY, aarch64
# ships gnu ONLY — so one arch's verdict says nothing about the other's and
# each was measured on its own. Repeated on ALL THREE in-range releases
# (6.4.0, 6.5.0, 7.0.0); byte-for-byte the same conclusion every time.
#
# UPX gate first, because a packed asset defeats readelf entirely (the stub
# leaves no PT_INTERP and no section headers, so `file` calls every asset
# "statically linked"):
#
#   $ strings -a <every asset>/cog | grep -c '^UPX'          → 0
#   $ readelf -h <every asset>/cog | grep -c 'section headers: 0'  → 0
#     ⇒ not packed; the measurements below are real.
#
#   $ file x86_64-unknown-linux-musl/cog
#   ELF 64-bit LSB pie executable, x86-64, version 1 (SYSV), static-pie
#   linked, not stripped
#   $ readelf -l … | grep -c INTERP   → 0
#   $ readelf -d … | grep -c NEEDED   → 0
#   $ readelf -V … | grep -o 'GLIBC_[0-9.]*'  → (empty)
#
#     ⇒ no PT_INTERP, no DT_NEEDED, not one glibc symbol version: the x86_64
#       artifact requires NOTHING of the host userland → BARE `linux/amd64`.
#       `+libc.musl` would be a FALSE requirement that hid the package from
#       every glibc host it in fact runs on.
#
#   $ file aarch64-unknown-linux-gnu/cog
#   ELF 64-bit LSB pie executable, ARM aarch64, version 1 (SYSV), dynamically
#   linked, interpreter /lib/ld-linux-aarch64.so.1, for GNU/Linux 3.7.0, not
#   stripped
#   $ readelf -d … | grep NEEDED
#     libgcc_s.so.1  libpthread.so.0  libdl.so.2  libc.so.6  ld-linux-aarch64.so.1
#   $ readelf -V … | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1  → GLIBC_2.18
#
#     ⇒ genuinely dynamic against glibc → `linux/arm64+libc.glibc`, and the
#       alpine leg is dropped for it in ../mirror-base.yml. The floors are not
#       symmetric across arches, which is exactly why neither was assumed.
#
# Non-Linux, for the record (no libc key applies to either):
#   $ file x86_64-apple-darwin/cog   → Mach-O 64-bit x86_64 executable
#   $ file aarch64-apple-darwin/cog  → Mach-O 64-bit arm64 executable
#   $ file x86_64-pc-windows-msvc/cog.exe
#                                    → PE32+ executable (console) x86-64
#
# ─── Scope (verified against 6.4.0, 6.5.0 and 7.0.0 — the whole range) ──────
#
# Every in-range release carries an IDENTICAL 6-asset set, re-listed per tag
# with `gh api repos/cocogitto/cocogitto/releases/tags/<tag> --jq
# '.assets[].name'`. Each anchored pattern below matches EXACTLY ONE asset on
# each of the three. A pattern matching ZERO is silently skipped, not an error
# — it would yield a green run with a missing platform.
#
# There are NO checksum/signature sidecars in these releases, so anchoring is
# not defending against a `.sha256` twin here; it is defending against the
# `armv7-unknown-linux-musleabihf` asset, whose name contains neither
# `x86_64` nor `aarch64` but does contain `unknown-linux-mus…`.
#
# The filenames DO carry the version (`cocogitto-7.0.0-…`), and each binary
# self-reports the same one — `cog --version` → `cog 6.4.0` / `cog 6.5.0` /
# `cog 7.0.0` from the respective tags — so the tag↔build correspondence is
# checked, not assumed.
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   cocogitto-<V>-armv7-unknown-linux-musleabihf.tar.gz
# 32-bit ARM has no OCX platform key at all — the `Architecture` enum is
# amd64 + arm64 ONLY — so it is not a gap, it is inexpressible.
assets:
  # Static musl build — requires nothing, so a BARE key with no feature suffix.
  linux/amd64:
    - "^cocogitto-.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
  # Dynamically linked against glibc — the suffix goes on BOTH this key and
  # the matching `platforms:` key in ../mirror-base.yml.
  "linux/arm64+libc.glibc":
    - "^cocogitto-.*-aarch64-unknown-linux-gnu\\.tar\\.gz$"
  # Staged rollout — uncommented one pass at a time, in lockstep with the
  # matching key in ../mirror-base.yml's `platforms:`. See the note there.
  #
  # darwin/amd64:
  #   - "^cocogitto-.*-x86_64-apple-darwin\\.tar\\.gz$"
  # darwin/arm64:
  #   - "^cocogitto-.*-aarch64-apple-darwin\\.tar\\.gz$"
  #
  # ⚠ The windows asset is a `.tar.gz`, NOT the usual `.zip` — unusual for an
  # msvc target and verified per tag. A `\\.zip$` pattern here would match
  # zero assets and be SILENTLY skipped.
  # windows/amd64:
  #   - "^cocogitto-.*-x86_64-pc-windows-msvc\\.tar\\.gz$"

# `tar tvf` on every declared asset of 6.4.0 and 7.0.0 — all six are the same
# two-entry shape, a wrapper directory named for the target triple:
#
#   cocogitto-<V>-<triple>.tar.gz →  <triple>/LICENSE   (-rw-r--r--, 1071 B)
#                                    <triple>/cog       (-rwxr-xr-x)
#   …-x86_64-pc-windows-msvc.tar.gz → x86_64-pc-windows-msvc/cog.exe
#
# So `strip_components: 1` uniformly: the wrapper name embeds the triple, so
# keeping it would need a different metadata file per platform for no gain,
# and after stripping the content root holds `cog` (or `cog.exe`) beside the
# upstream LICENSE — one metadata.json covers every platform. Windows takes
# the SAME setting as the rest precisely because its asset is a tarball with
# the same wrapper, not a flat zip.
#
# Format probe, before choosing `type: archive` at all: `gzip -dc <asset> |
# dd bs=1 skip=257 count=5` prints `ustar` on every asset INCLUDING the
# windows one — these are real tarballs, not bare single-file `.gz` (which
# ocx-mirror cannot read, and which `asset_type: binary` would silently ship
# still-compressed at 0755).
asset_type:
  type: archive
  strip_components: 1

# `off`, and it cannot be otherwise here. The scan needs an interface PATH
# entry of the form ${installPath}/<dir>, and this package has none: after the
# strip, `cog` sits at the content root on every platform. Both `auto` and
# `verify` therefore fail spec load at exit 65 —
#
#   bin_scan is enabled but metadata.json declares no interface-visible
#   ${installPath}/<dir> PATH entry — the verification would inspect no file
#   and pass green whatever the archive contains.
#
# — so `binaries` in metadata.json is hand-maintained, exactly as that error
# directs. It is short and stable: `cog` (`cog.exe` on windows) is the only
# executable in the archive on every platform and at both ends of the range,
# mode 0755, with `LICENSE` the only other entry. Quoted so no YAML 1.1 reader
# folds the bare word into boolean `false`.
bin_scan: "off"

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  # 6.4.0 is the floor and it is a REAL boundary, not a round number: it is
  # the first release carrying `cocogitto-<V>-aarch64-apple-darwin.tar.gz`.
  # 6.3.0 and 6.2.0 ship five assets each — verified by re-listing both —
  # with an x86_64 darwin build but no arm64 one, so backfilling past this
  # floor would silently drop darwin/arm64 (0 matches is skipped, not an
  # error). The three releases at or above it (6.4.0, 6.5.0, 7.0.0) each carry
  # the identical 6-asset set, so every in-range release resolves every
  # declared platform and no per-platform min_version window is needed.
  min: "6.4.0"
  new_per_run: 5
  poll_interval: "46 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default`
  # and `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: cocogitto/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/cocogitto/cocogitto/license --jq '.license.spdx_id'
  #   MIT
  org.opencontainers.image.licenses: "MIT"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: cocogitto/cocogitto
  fork: ocx-contrib/index
